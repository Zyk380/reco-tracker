<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recos">
<link rel="manifest" href="manifest.json">

<title>Recos Analystes</title>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
        --up:#16a34a;--down:#dc2626;--init:#2563eb;--neutral:#94a3b8}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;
         padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
  header h1{font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
  #updated{font-size:.75rem;color:#94a3b8;margin-top:2px}
  #refresh{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
  .controls{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  #search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);
          background:var(--card);color:var(--text);font-size:16px}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:7px 14px;border-radius:999px;border:1px solid var(--border);
        background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 4px}
  .stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:1.3rem}
  .stat span{font-size:.72rem;color:var(--muted)}
  .stat.up b{color:var(--up)} .stat.down b{color:var(--down)} .stat.init b{color:var(--init)}
  #list{padding:0 16px 24px}
  .day{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;
       letter-spacing:.04em;margin:18px 0 8px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);
        border-radius:14px;padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--neutral)}
  .card.up{border-left-color:var(--up)} .card.down{border-left-color:var(--down)}
  .card.init{border-left-color:var(--init)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ticker{font-weight:700;font-size:1.05rem}
  .badge{font-size:.72rem;padding:3px 9px;border-radius:999px;color:#fff;background:var(--neutral);white-space:nowrap}
