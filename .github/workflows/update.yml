name: Mise à jour des recommandations

on:
  schedule:
    - cron: "0 6,17 * * 1-5"   # 2 fois par jour, du lundi au vendredi
  workflow_dispatch:            # permet de le lancer manuellement

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python make_icons.py

      - run: python fetch_data.py

      - name: Enregistrer les donnees
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "MAJ donnees"
          git push
